{{- include "cindersearch.validateValues" . -}}
{{- $createMinioSecret := and (eq .Values.s3.mode "minio") (not .Values.s3.minio.existingSecret) -}}
{{- $createExternalSecret := and (eq .Values.s3.mode "external") (not .Values.s3.external.existingSecret) -}}
{{- if or $createMinioSecret $createExternalSecret }}
{{- $secretName := include "cindersearch.s3SecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cindersearch.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if $createMinioSecret }}
  {{- $userKey := .Values.s3.minio.rootUserKey -}}
  {{- $passKey := .Values.s3.minio.rootPasswordKey -}}
  {{- $user := .Values.s3.minio.rootUser -}}
  {{- $pass := .Values.s3.minio.rootPassword -}}
  {{- $existingPassB64 := "" -}}
  {{- if and (empty $pass) $existing }}
    {{- if $existing.data }}
      {{- $existingPassB64 = index $existing.data $passKey | default "" -}}
    {{- end }}
  {{- end }}
  {{- if $existingPassB64 }}
  {{ $userKey }}: {{ $user | b64enc | quote }}
  {{ $passKey }}: {{ $existingPassB64 | quote }}
  {{- else }}
  {{- if empty $pass }}
  {{- $pass = randAlphaNum 24 }}
  {{- end }}
  {{ $userKey }}: {{ $user | b64enc | quote }}
  {{ $passKey }}: {{ $pass | b64enc | quote }}
  {{- end }}
  {{- else if $createExternalSecret }}
  {{ .Values.s3.external.accessKeySecretKey }}: {{ .Values.s3.external.accessKey | b64enc | quote }}
  {{ .Values.s3.external.secretKeySecretKey }}: {{ .Values.s3.external.secretKey | b64enc | quote }}
  {{- end }}
{{- end }}
