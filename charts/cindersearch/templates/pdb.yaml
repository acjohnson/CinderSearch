{{- $fullname := include "cindersearch.fullname" . -}}
{{- if and .Values.data.podDisruptionBudget.enabled (gt (int .Values.data.replicaCount) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $fullname }}-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cindersearch.componentLabels" (dict "root" . "component" "data") | nindent 4 }}
spec:
  minAvailable: {{ .Values.data.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "cindersearch.componentSelectorLabels" (dict "root" . "component" "data") | nindent 6 }}
{{- end }}
